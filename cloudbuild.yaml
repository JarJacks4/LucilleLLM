steps:
  # Run tests before building. Tests MUST pass — failures block the deploy.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --quiet -r requirements.txt pytest pytest-asyncio httpx
        python -m pytest tests/ -v --tb=short
    id: 'test'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucillellm2', '.']
    waitFor: ['test']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lucillellm2']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'lucillellm2'
      - '--image=gcr.io/$PROJECT_ID/lucillellm2'
      - '--region=us-east4'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=600'
      - '--cpu-boost'
      # Environment variables — add your production web domain to CORS_ALLOWED_ORIGINS
      # before launching the web frontend. GCS_AUDIO_BUCKET is needed for soundscapes.
      - '--set-env-vars=ENVIRONMENT=production,LOG_FORMAT=json,LOG_LEVEL=INFO,RATE_LIMIT_CHAT=10,RATE_LIMIT_GLOBAL=100,CORS_ALLOWED_ORIGINS=,GCS_AUDIO_BUCKET='
      # Secrets from Google Secret Manager (never in env vars)
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest'
