steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucillellm2', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lucillellm2']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'lucillellm2'
      - '--image=gcr.io/$PROJECT_ID/lucillellm2'
      - '--region=us-east4'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=600'
      - '--cpu-boost'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest'
