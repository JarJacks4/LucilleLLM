steps:
  # Run tests before building. Tests MUST pass — failures block the deploy.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --quiet -r requirements.txt pytest pytest-asyncio httpx
        python -m pytest tests/ -v --tb=short
    id: 'test'

  # Build the container image.
  # Registry/service/region must match the RUNNING production service:
  #   service lucille, region us-central1, Artifact Registry lucille-repo.
  # This previously built gcr.io/$PROJECT_ID/lucillellm2 and deployed a
  # `lucillellm2` service to us-east4 — a service that does not exist in
  # this project, so a deploy would have silently created a second app and
  # left production untouched.
  #
  # Tagged with $BUILD_ID rather than COMMIT_SHA: COMMIT_SHA is only
  # populated for trigger-based builds and resolves to empty on a manual
  # `gcloud builds submit`, producing the invalid tag `lucille:` and failing
  # the build. BUILD_ID is always available. To trace a running revision
  # back to its source: `gcloud builds describe <BUILD_ID>`.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/lucille-repo/lucille:$BUILD_ID', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/lucille-repo/lucille:latest', '.']
    waitFor: ['test']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/lucille-repo/lucille']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'lucille'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/lucille-repo/lucille:$BUILD_ID'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=600'
      - '--cpu-boost'
      # Environment variables — add your production web domain to CORS_ALLOWED_ORIGINS
      # before launching the web frontend. GCS_AUDIO_BUCKET is needed for soundscapes.
      - '--set-env-vars=ENVIRONMENT=production,LOG_FORMAT=json,LOG_LEVEL=INFO,RATE_LIMIT_CHAT=10,RATE_LIMIT_GLOBAL=100,CORS_ALLOWED_ORIGINS=,GCS_AUDIO_BUCKET='
      # Secrets from Google Secret Manager (never in env vars)
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest'
