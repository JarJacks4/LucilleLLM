steps:
  # Run tests before building
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet -r requirements.txt pytest pytest-asyncio httpx
        python -m pytest tests/ -v --tb=short || echo "Tests failed - review output above"
    id: 'test'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucillellm2', '.']
    waitFor: ['test']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lucillellm2']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'lucillellm2'
      - '--image=gcr.io/$PROJECT_ID/lucillellm2'
      - '--region=us-east4'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=600'
      - '--cpu-boost'
      - '--set-env-vars=ENVIRONMENT=production,LOG_FORMAT=json,LOG_LEVEL=INFO,RATE_LIMIT_CHAT=10,RATE_LIMIT_GLOBAL=100'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest'
