runtime: python312
entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT

env_variables:
  GOOGLE_CLOUD_PROJECT: "escape-ujuzxr"

automatic_scaling:
  target_cpu_utilization: 0.6
  min_instances: 0
  max_instances: 10

resources:
  cpu: 1
  memory_gb: 2

handlers:
  - url: /.*
    script: auto
    secure: always

