name: Deploy to Cloud Run

# Tests run on every PR. Merging to main (or running this by hand) builds with
# cloudbuild.yaml, which runs the tests again, pushes to Artifact Registry and
# deploys the `lucille` service in us-central1.
# Auth is keyless (Workload Identity Federation) — see scripts/gcp/setup_deploy_access.sh.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: escape-self-care-505618   # Escape Firebase project (app sign-in + Firestore); do not change
  GCP_REGION: us-central1

permissions:
  contents: read
  id-token: write   # required for keyless auth to Google Cloud

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate production API entrypoint syntax
        run: python -m py_compile main.py
      # Import the actual production Uvicorn entrypoint, not only escape_api's
      # isolated pytest app. A dummy key avoids using production secrets.
      # This catches missing/renamed LangChain symbols before Cloud Run rollout.
      - name: Smoke-test production API import
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          ENVIRONMENT: test
        run: timeout 120s python -c "from main import app; assert app.title == 'LucilleLLM API'"
      - run: python -m pytest tests -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      # --async avoids gcloud's Cloud Build *log streaming* permissions requirement.
      # Query the build resource instead; only a confirmed SUCCESS allows the next step.
      - name: Deploy the render service (cloudbuild-render.yaml)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID=$(gcloud builds submit --async --config cloudbuild-render.yaml \
            --project "$GCP_PROJECT_ID" --format="value(id)" .)
          if [[ -z "$BUILD_ID" ]]; then
            echo "::error::Cloud Build did not return a build ID"
            exit 1
          fi
          echo "Render build: $BUILD_ID"
          echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$GCP_PROJECT_ID"
          for attempt in {1..120}; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$GCP_PROJECT_ID" --format="value(status)")
            echo "Render build: $STATUS (poll $attempt/120)"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Render build $BUILD_ID ended with $STATUS"
                exit 1 ;;
              QUEUED|PENDING|WORKING) sleep 15 ;;
              *) echo "::error::Unexpected Cloud Build status: $STATUS"; exit 1 ;;
            esac
            if [[ "$attempt" -eq 120 ]]; then
              echo "::error::Timed out waiting for render build $BUILD_ID"
              exit 1
            fi
          done
      - name: Build, test and deploy the API (cloudbuild.yaml)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID=$(gcloud builds submit --async --config cloudbuild.yaml \
            --project "$GCP_PROJECT_ID" --format="value(id)" .)
          if [[ -z "$BUILD_ID" ]]; then
            echo "::error::Cloud Build did not return a build ID"
            exit 1
          fi
          echo "API build: $BUILD_ID"
          echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$GCP_PROJECT_ID"
          for attempt in {1..120}; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$GCP_PROJECT_ID" --format="value(status)")
            echo "API build: $STATUS (poll $attempt/120)"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::API build $BUILD_ID ended with $STATUS"
                exit 1 ;;
              QUEUED|PENDING|WORKING) sleep 15 ;;
              *) echo "::error::Unexpected Cloud Build status: $STATUS"; exit 1 ;;
            esac
            if [[ "$attempt" -eq 120 ]]; then
              echo "::error::Timed out waiting for API build $BUILD_ID"
              exit 1
            fi
          done
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe lucille --region us-central1 --format='value(status.url)')
          curl -fsS "$URL/health" > /dev/null
          curl -fsS "$URL/v1/health"
          # Keep the production smoke check in sync with the 11-category v1 catalog.
          # Validate exact IDs and non-empty inventories, not just a raw count.
          curl -fsS "$URL/v1/soundscapes/categories" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          expected = ["music_meditations", "vaporwave", "jazz", "nature",
                      "binaural_beats", "brainwave_music", "raw_frequencies",
                      "sleep_ambient", "depression_anxiety", "dreamdrift",
                      "nature_elements"]
          actual = [category["id"] for category in data["categories"]]
          assert actual == expected, f"Unexpected soundscape categories: {actual!r}"
          assert all(category["trackCount"] >= 4 for category in data["categories"]), "Missing soundscape tracks"
          print(f"Soundscapes OK: {len(actual)} categories")
          '
          RURL=$(gcloud run services describe lucille-render --region us-central1 --format='value(status.url)')
          curl -fsS "$RURL/health"
